<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shruthika Women's & Children's Welfare Trust</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header / Navbar */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 6px 14px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            border-bottom: 2px solid #ffffff;
            border-top: 2px solid #ffffff;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), url('assets/img/hero.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 120px 80px 60px;
            color: #ffffff;
        }

        .hero-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .hero-chip i {
            color: #ff4d4d;
        }

        .hero-title {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.25;
            max-width: 900px;
            letter-spacing: -1px;
        }

        @media (max-width: 900px) {
            .header {
                padding: 15px 20px;
            }
            .hero {
                padding: 100px 30px 40px;
            }
            .hero-title {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <img src="assets/img/logo.png" alt="Shruthika Trust Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="causes.html">Our Causes</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="donate.html">Donate</a></li>
            <li><a href="contact.html">Contact us</a></li>
        </ul>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <div class="hero-chip">
            <i class="fa-solid fa-heart"></i> A registered charitable trust in Bengaluru, Karnataka
        </div>
        <h1 class="hero-title">
            Serving Humanity is<br>
            Considered to be<br>
            Serving God.
        </h1>
    </section>

</body>
</html>
