<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunities – Shruthika Charity</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4fd 0%, #e1e9f9 100%);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        h2 {
            text-align: center;
            color: #1a237e;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 22px;
            padding: 24px 18px 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
            transition: all 0.35s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.13);
            background: #ffffff;
        }

        .img-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 18px;
            overflow: hidden;
            border: 3px solid transparent;
            box-shadow: 0 8px 24px rgba(79, 172, 254, 0.25);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            background: linear-gradient(135deg, #4facfe, #00f2fe) padding-box,
                        linear-gradient(135deg, #4facfe, #00f2fe) border-box;
        }

        .card:hover .img-wrapper {
            transform: scale(1.07);
            box-shadow: 0 14px 36px rgba(79, 172, 254, 0.35);
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Per-card gradient borders */
        .card:nth-child(1) .img-wrapper { box-shadow: 0 8px 24px rgba(79,172,254,0.25); background: linear-gradient(135deg,#4facfe,#00f2fe) padding-box, linear-gradient(135deg,#4facfe,#00f2fe) border-box; }
        .card:nth-child(2) .img-wrapper { box-shadow: 0 8px 24px rgba(255,8,68,0.22); background: linear-gradient(135deg,#ff0844,#ffb199) padding-box, linear-gradient(135deg,#ff0844,#ffb199) border-box; }
        .card:nth-child(3) .img-wrapper { box-shadow: 0 8px 24px rgba(253,160,133,0.28); background: linear-gradient(135deg,#f6d365,#fda085) padding-box, linear-gradient(135deg,#f6d365,#fda085) border-box; }
        .card:nth-child(4) .img-wrapper { box-shadow: 0 8px 24px rgba(205,156,242,0.28); background: linear-gradient(135deg,#cd9cf2,#a855f7) padding-box, linear-gradient(135deg,#cd9cf2,#a855f7) border-box; }
        .card:nth-child(5) .img-wrapper { box-shadow: 0 8px 24px rgba(67,233,123,0.25); background: linear-gradient(135deg,#43e97b,#38f9d7) padding-box, linear-gradient(135deg,#43e97b,#38f9d7) border-box; }
        .card:nth-child(6) .img-wrapper { box-shadow: 0 8px 24px rgba(250,112,154,0.28); background: linear-gradient(135deg,#fa709a,#fee140) padding-box, linear-gradient(135deg,#fa709a,#fee140) border-box; }
        .card:nth-child(7) .img-wrapper { box-shadow: 0 8px 24px rgba(48,207,208,0.28); background: linear-gradient(135deg,#30cfd0,#330867) padding-box, linear-gradient(135deg,#30cfd0,#330867) border-box; }
        .card:nth-child(8) .img-wrapper { box-shadow: 0 8px 24px rgba(161,140,209,0.28); background: linear-gradient(135deg,#a18cd1,#fbc2eb) padding-box, linear-gradient(135deg,#a18cd1,#fbc2eb) border-box; }

        .card h3 {
            color: #222;
            font-size: 1.05rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>We Provide Opportunity in the Field Of</h2>
        <div class="grid">

            <!-- House keeping F & M -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="house keeping.png" alt="House keeping F & M">
                </div>
                <h3>House keeping F &amp; M</h3>
            </div>

            <!-- Home Nurses -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 11_29_34 AM.png" alt="Home Nurses">
                </div>
                <h3>Home Nurses</h3>
            </div>

            <!-- Baby sitting -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 11_29_42 AM.png" alt="Baby sitting">
                </div>
                <h3>Baby sitting</h3>
            </div>

            <!-- Beautician -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 11_29_50 AM.png" alt="Beautician">
                </div>
                <h3>Beautician</h3>
            </div>

            <!-- Patient care -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 11_29_34 AM.png" alt="Patient care">
                </div>
                <h3>Patient care</h3>
            </div>

            <!-- Drivers jobs -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 05_25_09 PM.png" alt="Drivers jobs">
                </div>
                <h3>Drivers jobs</h3>
            </div>

            <!-- Security -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 05_24_59 PM.png" alt="Security">
                </div>
                <h3>Security</h3>
            </div>

            <!-- Etc -->
            <div class="card">
                <div class="img-wrapper">
                    <img src="ChatGPT Image Aug 18, 2026, 05_32_34 PM.png" alt="Etc">
                </div>
                <h3>Etc</h3>
            </div>

        </div>
    </div>
</body>
</html>
