<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Shruthika Women's and Children's Welfare Trust emblem">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f2d11"/>
      <stop offset="1" stop-color="#5c1a0a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#f58220"/>
    </linearGradient>
    <path id="arcTop" d="M100 100 m-72 0 a72 72 0 0 1 144 0" fill="none"/>
    <path id="arcBottom" d="M100 100 m72 0 a72 72 0 0 1 -144 0" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#ring)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#d9a441" stroke-width="2"/>
  <circle cx="100" cy="100" r="60" fill="url(#core)"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#fff7ee" stroke-width="3"/>

  <!-- Mother sheltering a child -->
  <g fill="#7a2410">
    <circle cx="88" cy="76" r="12"/>
    <path d="M88 91c-15 0-25 11-25 26v18h50v-18c0-15-10-26-25-26z"/>
    <circle cx="117" cy="97" r="8.5" fill="#fff7ee"/>
    <path d="M117 108c-10 0-17 7-17 16v11h34v-11c0-9-7-16-17-16z" fill="#fff7ee"/>
  </g>

  <!-- Protective arc over the pair -->
  <path d="M56 118a44 44 0 0 1 88 0" fill="none" stroke="#7a2410" stroke-width="3.5" stroke-linecap="round" opacity=".35"/>

  <text font-family="Outfit, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#ffd9a8" letter-spacing="2.4">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">SHRUTHIKA WOMEN'S &amp; CHILDREN'S</textPath>
  </text>
  <text font-family="Outfit, Segoe UI, sans-serif" font-size="13.5" font-weight="700" fill="#ffd9a8" letter-spacing="3.4">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">WELFARE TRUST</textPath>
  </text>

  <g fill="#d9a441">
    <circle cx="26" cy="128" r="3.5"/>
    <circle cx="174" cy="128" r="3.5"/>
  </g>
</svg>
